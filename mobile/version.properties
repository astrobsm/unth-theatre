# The Android app's version. THE ONLY PLACE IT IS DECLARED.
#
# versionCode is what Android compares when deciding whether an APK may
# replace the installed one. It must INCREASE on every published build.
# Shipping a build whose versionCode equals the installed one is refused, and
# several OEM skins word that refusal as "App not installed as package appears
# to be invalid" — a message that names neither the version nor the problem.
# That is what happened on the 1.0 -> 1.1 rebuild.
#
# versionName is what people see, and what src/app/downloads/page.tsx
# advertises as APK_VERSION. Keep the two in step; downloadsPage.test.ts and
# mobileVersion.test.ts check that nothing drifts.
versionCode=6
versionName=1.5
