<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signed in — UNTH Theatre ORM</title>

<!--
  Served by the router immediately after a SUCCESSFUL hotspot login.

  This is the page that makes the app open by itself. $(link-redirect) is
  whatever the login form put in `dst`, and the app's portal page sets that to
  http://unth-theatre.orm/dashboard — so the person lands on the dashboard,
  already signed in, without typing an address.

  Without this file the router serves its own default, which honours the
  originally requested URL instead. On a phone that is a connectivity-check
  address like connectivitycheck.gstatic.com, so the mini-browser decides the
  internet is working and closes. Login succeeds and the staff member is left
  looking at their home screen wondering what happened.

  Three redirects, because captive-portal mini-browsers are not real browsers
  and each of them ignores something different:
    - meta refresh    works where scripting is restricted
    - script assign   fastest where it runs
    - the link        the fallback a person can actually tap
-->

<meta http-equiv="refresh" content="0; url=$(link-redirect)">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center;
         justify-content:center; background:#0f172a; color:#e2e8f0;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         text-align:center; padding:24px; }
  .card { max-width:22rem; }
  h1 { font-size:1.25rem; margin:0 0 .5rem; }
  p  { margin:0 0 1.25rem; color:#94a3b8; font-size:.95rem; line-height:1.5; }
  a.btn { display:inline-block; background:#2563eb; color:#fff; text-decoration:none;
          padding:.75rem 1.5rem; border-radius:.6rem; font-weight:600; }
  .spin { width:2rem; height:2rem; margin:0 auto 1rem; border:3px solid #1e293b;
          border-top-color:#2563eb; border-radius:50%; animation:s .8s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="spin"></div>
    <h1>You're connected</h1>
    <p>Opening UNTH Theatre ORM…</p>
    <!-- If both redirects were ignored, this is still one tap. -->
    <a class="btn" href="$(link-redirect)">Open ORM</a>
  </div>

  <script>
    // Replace rather than assign: the portal page must not sit in history,
    // where Back would return to a login form that has already been used.
    location.replace("$(link-redirect)");
  </script>
</body>
</html>
