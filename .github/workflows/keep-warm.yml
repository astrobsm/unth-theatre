name: Keep Vercel warm

# Prevents "cold start" slowness: Vercel puts idle deployments to sleep, so the
# first request after a quiet spell is slow. This job pings the live site on a
# schedule so a real app launch always hits an already-running instance.
#
# Runs entirely on GitHub's free runners from this repo — no third-party service.

on:
  schedule:
    # Every 5 minutes (GitHub's minimum). Note: scheduled runs can be delayed a
    # few minutes when GitHub is busy — that's fine for keep-warm.
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # allows a manual "Run workflow" from the Actions tab

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint + dashboard
        run: |
          BASE="https://unth-theatre-mai.vercel.app"
          # Warm the serverless runtime via the cheap health route...
          echo "Pinging $BASE/api/ping"
          curl -fsS --max-time 30 "$BASE/api/ping" || echo "ping endpoint not reachable (ok if mid-deploy)"
          # ...and the dashboard page so the page renderer stays warm too.
          echo "Warming $BASE/dashboard"
          curl -fsS --max-time 30 -o /dev/null "$BASE/dashboard" || echo "dashboard warm skipped"

          # ...and the SYNC ROUTES, which matter most and were missed.
          #
          # Every route is its own serverless function with its own warm state,
          # so warming /api/ping does nothing whatsoever for /api/sync/push. The
          # theatre server touches these once a minute — long enough to go cold
          # between cycles — and on 20 August a cold start alone measured 41.5
          # seconds against a 60-second client timeout. Push aborted every cycle
          # for fifty minutes while pull succeeded, because the failed push had
          # just warmed the function for it.
          #
          # No credentials needed and none used: an unauthenticated POST is
          # rejected with a 401, and a 401 warms the function exactly as well as
          # a 200. -f is deliberately omitted so that expected 401 is not
          # treated as a failure.
          for route in /api/sync/push /api/sync/pull; do
            echo "Warming $BASE$route"
            curl -sS --max-time 30 -o /dev/null -X POST "$BASE$route" \
              -H 'Content-Type: application/json' -d '{}' \
              || echo "warm skipped for $route"
          done
          echo "Done."
